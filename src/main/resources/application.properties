spring.application.name=spring_ai_mcp_mysql002

# App starts without a key. Each team/user supplies their own OpenAI key in
# Configuration → Configure AI key; it is encrypted and stored in local H2.
# Empty placeholder lets Spring AI autoconfig boot; runtime client uses the H2 key only.
spring.ai.openai.api-key=
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.1

# AES key material for encrypting the OpenAI key in H2 (set per deployment)
app.security.crypto-secret=${APP_CRYPTO_SECRET:deploy-agent-local-dev-secret-change-me}

# MCP disabled so the app can start for the deploy chat UI.
spring.ai.mcp.client.enabled=false
spring.ai.mcp.client.stdio.servers-configuration=classpath:/mcp-servers.json
spring.ai.mcp.client.toolcallback.enabled=false

# Jenkins Remote Access API (username + API token from Settings UI / H2)
app.jenkins.build.job=common-build-job
app.jenkins.deploy.job=common-deploy-job
app.jenkins.rollback.job=common-rollback-job
app.jenkins.timeout-minutes=30
app.jenkins.poll-seconds=5

# Writable applications catalog (relative to process working directory)
app.applications.file=src/main/resources/applications.json

# Console logging for chat + tool calls
logging.level.root=INFO
logging.level.org.example.springai_agent_terraform_deploy_do=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# port 8081
server.port=8081

# --- Auth (H2 for now; swap datasource later) ---
spring.datasource.url=jdbc:h2:file:./data/deployagent;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Default bootstrap user (created only if missing)
app.security.default-admin.username=admin
app.security.default-admin.password=admin