<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Deploy Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d17;
            --surface: #1a1d2e;
            --surface-2: #151828;
            --border: rgba(255, 255, 255, 0.08);
            --text: #c8cdd8;
            --text-strong: #f0f2f8;
            --muted: #8b93a7;
            --accent: #7c5cff;
            --accent-hover: #6d5efc;
            --accent-text: #fff;
            --danger: #f87171;
            --ok: #6ee7b7;
            --radius: 16px;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            --font: "DM Sans", "Segoe UI", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: var(--font);
            color: var(--text);
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(124, 92, 255, 0.22), transparent 55%),
                radial-gradient(ellipse 70% 50% at 90% 80%, rgba(56, 189, 248, 0.12), transparent 50%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 1.25rem;
            -webkit-font-smoothing: antialiased;
        }
        .login-card {
            width: min(100%, 26rem);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.75rem 1.6rem 1.5rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin-bottom: 1.35rem;
        }
        .brand-icon {
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(124, 92, 255, 0.35);
        }
        .brand-icon svg {
            width: 1.2rem;
            height: 1.2rem;
            color: #fff;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-strong);
            letter-spacing: -.02em;
        }
        .brand p {
            margin: .15rem 0 0;
            font-size: .78rem;
            color: var(--muted);
        }
        label {
            display: block;
            font-size: .74rem;
            font-weight: 600;
            color: var(--muted);
            margin: .85rem 0 .35rem;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text-strong);
            font: inherit;
            font-size: .92rem;
            padding: .7rem .85rem;
            outline: none;
        }
        input:focus {
            border-color: rgba(124, 92, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.18);
        }
        .alert {
            margin: 0 0 .85rem;
            padding: .65rem .8rem;
            border-radius: 10px;
            font-size: .82rem;
            line-height: 1.4;
        }
        .alert.error {
            color: #fecaca;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .alert.ok {
            color: var(--ok);
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.28);
        }
        button[type="submit"] {
            width: 100%;
            margin-top: 1.25rem;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-text);
            font: inherit;
            font-size: .92rem;
            font-weight: 600;
            padding: .75rem 1rem;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .hint {
            margin: 1rem 0 0;
            font-size: .74rem;
            color: var(--muted);
            text-align: center;
            line-height: 1.45;
        }
        .hint code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: .72rem;
            color: var(--text);
            background: var(--surface-2);
            padding: .1rem .35rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<main class="login-card" aria-label="Sign in">
    <div class="brand">
        <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
            </svg>
        </div>
        <div>
            <h1>Deploy Agent</h1>
            <p>Sign in to continue</p>
        </div>
    </div>

    <div th:if="${param.error}" class="alert error" role="alert">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert ok" role="status">
        Signed out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>

    <p class="hint">Default: <code>admin</code> / <code>admin</code></p>
</main>
</body>
</html>
